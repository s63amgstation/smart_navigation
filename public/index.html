<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6feb" />
    <title>스마트 길찾기</title>
    <link rel="stylesheet" href="./css/styles.css?v=__ASSET_VER__" />
    <!-- TMAP 지도 SDK 는 HTML 파싱 단계에서 실행되어야 한다(내부에서 document.write 로 진짜 SDK 를 주입). -->
    <!-- __TMAP_KEY__ 자리는 서버가 .env 의 TMAP_APP_KEY 로 치환한다. -->
    <script src="https://apis.openapi.sk.com/tmap/jsv2?version=1&appKey=__TMAP_KEY__"></script>
  </head>
  <body>
    <!-- 전역 배경: 홈에서만 노출 (body.home-active 가 켜질 때) -->
    <div class="weather-bg" id="weatherBg"></div>

    <!-- 상단 바 -->
    <header class="appbar">
      <button id="backBtn" class="icon-btn" hidden aria-label="뒤로">‹</button>
      <h1 id="title">스마트 길찾기</h1>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>

    <main id="app">
      <!-- 홈 — 풀스크린 날씨 배경 + 상단 인사 + 하단 메뉴 3개 -->
      <section data-view="home" class="view home-screen active">
        <div class="home-top">
          <div class="welcome-info" id="welcomeInfo"></div>
          <h2 class="welcome-greeting" id="welcomeGreeting">안녕하세요</h2>
          <p class="welcome-sub">어디로 가시나요?</p>
        </div>
        <div class="home-menus">
          <button class="menu-card glass" data-go="menu1">
            <div class="menu-emoji">📍</div>
            <div class="menu-text">
              <strong>경유지 시간 비교</strong>
              <span>가는 길에 들를 곳 / 직접 경로만</span>
            </div>
            <span class="chev">›</span>
          </button>
          <button class="menu-card glass" data-go="menu2">
            <div class="menu-emoji">🔀</div>
            <div class="menu-text">
              <strong>멀티 경유지 최적화</strong>
              <span>여러 곳을 들를 때 가장 빠른 순서</span>
            </div>
            <span class="chev">›</span>
          </button>
          <button class="menu-card glass" data-go="favs">
            <div class="menu-emoji">⭐</div>
            <div class="menu-text">
              <strong>즐겨찾기 등록</strong>
              <span>집·회사 등 자주 가는 곳</span>
            </div>
            <span class="chev">›</span>
          </button>
        </div>
      </section>

      <!-- 즐겨찾기 관리 (별도 화면) -->
      <section data-view="favs" class="view">
        <div class="fav-section">
          <div class="fav-header">
            <h3>즐겨찾기 <span class="muted" id="favCount">0/10</span></h3>
            <button id="favAddBtn" class="ghost-btn fav-add-btn">+ 추가</button>
          </div>
          <div class="fav-grid" id="favGrid"></div>

          <!-- 인라인 추가/편집 폼 (모달 아님) -->
          <div id="favForm" class="fav-form" hidden>
            <h4 id="favFormTitle">새 즐겨찾기</h4>
            <div class="field">
              <label>별칭 <small>(예: 집, 회사, 학교)</small></label>
              <input id="favLabel" class="text-input" maxlength="20" placeholder="별칭" />
            </div>
            <div class="field" id="favPlaceField">
              <label>장소</label>
              <div class="place-input" data-role="fav"></div>
            </div>
            <div class="form-actions">
              <button id="favCancel" class="ghost-btn">취소</button>
              <button id="favSave" class="primary-btn">저장</button>
            </div>
          </div>

          <p class="hint">여기서 등록한 장소는 모든 검색 입력에서 한 번 탭으로 들어갑니다.</p>
        </div>
      </section>

      <!-- 메뉴 1 -->
      <section data-view="menu1" class="view">
        <div class="field">
          <label>출발지</label>
          <div class="place-input" data-role="start"></div>
        </div>
        <div class="field">
          <label>도착지</label>
          <div class="place-input" data-role="dest"></div>
        </div>
        <div class="field">
          <label>찾을 장소 <small>(비우면 직접 경로만 조회)</small></label>
          <input id="m1-keyword" class="text-input" placeholder="예: 스타벅스, 주유소 — 비워도 됩니다" />
          <div class="chips" id="m1-chips"></div>
          <!-- 검색 anchor 선택: 출발지 가까이서? 도착지 가까이서? -->
          <div class="anchor-toggle" id="m1-anchor" role="tablist" aria-label="후보 검색 중심">
            <button type="button" class="ax-opt active" data-anchor="start" role="tab" aria-selected="true">🚀 출발지 중심</button>
            <button type="button" class="ax-opt" data-anchor="dest" role="tab" aria-selected="false">🎯 도착지 중심</button>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>기준</label>
            <select id="m1-ptype" class="text-input">
              <option value="departure">출발 시각</option>
              <option value="arrival">도착 시각</option>
            </select>
          </div>
          <div class="field">
            <label>시간 <small>(10분 단위)</small></label>
            <div class="dt-wrap">
              <div class="dt-display">
                <span class="dt-d-date">—</span>
                <span class="dt-d-dot">·</span>
                <span class="dt-d-time">—</span>
              </div>
              <input id="m1-time" type="datetime-local" step="600" class="dt-native" aria-label="시간 선택" />
            </div>
          </div>
        </div>
        <button id="m1-run" class="primary-btn">조회 / 최적 경유지 찾기</button>
        <div id="m1-result" class="result"></div>
        <div id="m1-map" class="map" hidden></div>
        <div id="m1-nav" class="nav-apps" hidden></div>
      </section>

      <!-- 메뉴 2 -->
      <section data-view="menu2" class="view">
        <div class="field">
          <label>출발지</label>
          <div class="place-input" data-role="m2start"></div>
        </div>
        <div class="field">
          <label>경유지 <small>(최대 5)</small></label>
          <div id="m2-waypoints"></div>
          <button id="m2-add" class="ghost-btn">+ 경유지 추가</button>
        </div>
        <div class="field">
          <label>도착지</label>
          <div class="place-input" data-role="m2dest"></div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>기준</label>
            <select id="m2-ptype" class="text-input">
              <option value="departure">출발 시각</option>
              <option value="arrival">도착 시각</option>
            </select>
          </div>
          <div class="field">
            <label>시간 <small>(10분 단위)</small></label>
            <div class="dt-wrap">
              <div class="dt-display">
                <span class="dt-d-date">—</span>
                <span class="dt-d-dot">·</span>
                <span class="dt-d-time">—</span>
              </div>
              <input id="m2-time" type="datetime-local" step="600" class="dt-native" aria-label="시간 선택" />
            </div>
          </div>
        </div>
        <button id="m2-run" class="primary-btn">최적 순서 계산</button>
        <div id="m2-result" class="result"></div>
        <div id="m2-map" class="map" hidden></div>
        <div id="m2-nav" class="nav-apps" hidden></div>
      </section>
    </main>

    <!-- 검색 기록 (우측 슬라이드 패널) -->
    <button id="histTab" class="hist-tab" hidden aria-label="검색 기록 열기">
      <span class="hist-tab-ic">⌛</span>
      <span class="hist-tab-tx">기록</span>
    </button>
    <div id="histBackdrop" class="hist-backdrop" hidden></div>
    <aside id="histPanel" class="hist-panel" hidden aria-hidden="true">
      <div class="hist-head">
        <h3>최근 검색 <span class="muted" id="histCount">0</span></h3>
        <button id="histClose" class="icon-btn" aria-label="닫기">✕</button>
      </div>
      <div id="histEmpty" class="hist-empty">아직 검색 기록이 없어요.</div>
      <div id="histList" class="hist-list"></div>
      <div class="hist-foot">
        <button id="histClearAll" type="button" class="ghost-btn" style="color:#b91c1c">전체 삭제</button>
      </div>
    </aside>

    <div id="toast" class="toast" hidden></div>

    <script src="./js/storage.js?v=__ASSET_VER__"></script>
    <script src="./js/weather.js?v=__ASSET_VER__"></script>
    <script src="./js/api.js?v=__ASSET_VER__"></script>
    <script src="./js/map.js?v=__ASSET_VER__"></script>
    <script src="./js/place-input.js?v=__ASSET_VER__"></script>
    <script src="./js/app.js?v=__ASSET_VER__"></script>
  </body>
</html>
